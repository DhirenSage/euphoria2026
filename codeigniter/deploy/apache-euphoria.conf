<VirtualHost *:80>
    ServerName events.example.edu
    Redirect permanent / https://events.example.edu/
</VirtualHost>

<VirtualHost *:443>
    ServerName events.example.edu
    DocumentRoot /var/www/euphoria/public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/events.example.edu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/events.example.edu/privkey.pem

    <Directory /var/www/euphoria/public>
        AllowOverride All
        Options -Indexes -ExecCGI
        Require all granted
        FallbackResource /index.php
    </Directory>

    <Directory /var/www/euphoria/writable>
        Require all denied
    </Directory>

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>